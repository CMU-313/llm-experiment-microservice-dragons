name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Ollama service
        run: |
          docker compose up -d ollama
          # Wait for Ollama to be healthy
          timeout 120 bash -c 'until docker exec ollama ollama list > /dev/null 2>&1; do sleep 2; done'

      - name: Pull Ollama model
        run: |
          docker exec ollama ollama pull deepseek-r1:1.5b

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Fallback for pyproject-managed deps if requirements.txt omitted
          if [ -f pyproject.toml ]; then pip install pytest; fi

      - name: Run tests with Ollama
        env:
          OLLAMA_HOST: http://localhost:11434
          OLLAMA_MODEL: deepseek-r1:1.5b
        run: |
          pytest -q


